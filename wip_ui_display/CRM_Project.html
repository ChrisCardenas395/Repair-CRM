<!doctype html>
<html lang="en">
  <head>
    <title>Customer Relationship Management System</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="crm_style.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
      /* --------------------------- MAIN WEBSITE ---------------------- */
      /* Remove the navbar's default margin-bottom and rounded borders */
      .navbar {
        margin-bottom: 0;
        border-radius: 0;
      }

      /* Set height of the grid so .sidenav can be 100% (adjust as needed) */
      .row.content {
        height: 450px;
      }

      /* Set gray background color and 100% height */
      .sidenav {
        padding-top: 20px;
        background-color: #f1f1f1;
        height: 100%;
      }

      /* Set black background color, white text and some padding */
      footer {
        background-color: #555;
        color: white;
        padding: 15px;
      }

      /* On small screens, set height to 'auto' for sidenav and grid */
      @media screen and (max-width: 767px) {
        .sidenav {
          height: auto;
          padding: 15px;
        }
        .row.content {
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-inverse">
      <div class="container-fluid">
        <div class="navbar-header">
          <button

            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
          </button>
          <a class="navbar-brand" href="#">Logo</a>
        </div>
        <div class="collapse navbar-collapse" id="myNavbar">
          <ul class="nav navbar-nav">
            <li class="active"><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
          </ul>
          <ul class="nav navbar-nav navbar-right">
            <li>
              <a href="#"
                ><span class="glyphicon glyphicon-log-in"></span> Login</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container-fluid text-center">
      <div class="row content">
        <div class="col-sm-2 sidenav">
          <p><a href="#">Link</a></p>
          <p><a href="#">Link</a></p>
          <p><a href="#">Link</a></p>
        </div>
        <div class="col-sm-8 text-left">
          <h1>Techincian Homepage</h1>
          <p>Insert description here</p>
          <!-- --------------------------- KANBAN BOARD ---------------------- -->
          <div class="container-fluid py-4">
            <div class="kanban-board">
            <!-- ----------------- ----- COLLAPSE -------------------- -->
              <div class="kanban-column" id="received">
                <p>
                  <button class="btn btn-primary"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapseWidthExample"
                    aria-expanded="false"
                    aria-controls="collapseWidthExample">
                    Toggle
                  </button>
                </p>
                <div style="min-height: 120px">
                  <div
                    class="collapse collapse-horizontal"
                    id="collapseWidthExample">
                    
                    <div class="card card-body" style="width: 200px">
                      The fact that this text is seen means it works! 
                    </div>
                  </div>
                </div>
                <h4>Received from Customer</h4>
              </div>
              <!-- ----------------- ----- COLLAPSE -------------------- -->
              
              <div class="kanban-column" id="review">
                <h4>Under Review</h4>
                <!-- <div class="tasks" data-status="in-progress"></div> -->
              </div>
              <div class="kanban-column" id="parts">
                <h4>Waiting for Parts</h4>
              </div>
              <div class="kanban-column" id="progress">
                <h4>In Progress</h4>
              </div>
              <div class="kanban-column" id="done">
                <h4>Done + Awaiting Payment</h4>
              </div>
              <div class="kanban-column" id="shipped">
                <h4>Shipped</h4>
              </div>
            </div>
          </div>
          <!--  --------------------------- KANBAN BOARD ---------------------- -->
        </div>

    </div> -->
